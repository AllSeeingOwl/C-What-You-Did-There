<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tape landing page · Side C mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@500;700&amp;family=Patrick+Hand&amp;family=Permanent+Marker&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#101216}
a{color:#9CC2FF}a:hover{color:#C6DCFF}
button{font-family:inherit}
</style>
<script src="runtime.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; background: #101216; color: #E8E9EC; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">
<div style="max-width: 1400px; margin: 0 auto; padding: 20px 24px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">

<!-- Top bar -->
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #262A31">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="#E8E9EC" stroke-width="1.6" aria-hidden="true"><rect x="1" y="1" width="28" height="20" rx="3"></rect><circle cx="10" cy="10" r="3"></circle><circle cx="20" cy="10" r="3"></circle><path d="M6 21l3-5h12l3 5"></path></svg>
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.01em">Side C</span><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 12px; color: #A7ABB3">(What You Did There)</span></span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="#" style="padding: 10px 14px; border-radius: 8px; color: #E8E9EC; background: #1D2026; text-decoration: none">Browse tapes</a>
<a href="#" style="padding: 10px 14px; border-radius: 8px; color: #B4B8C0; text-decoration: none">My shelf</a>
<a href="#" style="padding: 10px 14px; border-radius: 8px; color: #B4B8C0; text-decoration: none">Write a tape</a>
</div>
</div>

<!-- Hero -->
<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<!-- J-card -->
<div style="flex: 0 0 auto; width: 320px; max-width: 100%; height: 420px; display: flex; border-radius: 6px; overflow: hidden; background: #EDE9E0; color: #1A1B1E; box-shadow: 0 18px 40px rgba(0,0,0,0.45)" role="img" aria-label="J-card cover for Rain on a Tuesday">
<div style="width: 22px; display: flex; flex-direction: column">
<div style="flex: 28; background: #A7ABB3"></div><div style="flex: 102; background: #E9A23B"></div><div style="flex: 95; background: #4C8DF6"></div><div style="flex: 115; background: #F06A6E"></div><div style="flex: 45; background: #3DBE7A"></div><div style="flex: 40; background: linear-gradient(#3DBE7A 0 50%, #E9A23B 50% 100%)"></div><div style="flex: 55; background: #A68BF5"></div>
</div>
<div style="flex: 1; padding: 20px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em"><span>SIDE C</span><span>C15</span></div>
<div style="font-family: 'Permanent Marker', cursive; font-size: 30px; line-height: 1.05; color: #1F2A44">Rain on a Tuesday</div>
<div style="height: 1px; background: #1A1B1E"></div>
<div style="display: flex; flex-direction: column; gap: 0; font-family: 'Patrick Hand', 'Comic Neue', cursive; font-size: 15px; line-height: 1.15; color: #1F2A44">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="12">
<span style="display: flex; gap: 8px"><span style="width: 16px; flex: none">{{s.num}}</span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.jcard}}</span></span>
</sc-for>
</div>
<div style="margin-top: auto; font-family: 'Patrick Hand', 'Comic Neue', cursive; font-size: 15px; color: #3A3F48">by [CREATOR]</div>
</div>
</div>

<!-- Hero copy -->
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A7ABB3; letter-spacing: 0.08em; text-transform: uppercase">C15 · 8:00 · 12 slots · Medium</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 52px; letter-spacing: -0.025em; line-height: 1">Rain on a Tuesday</h1>
<span style="color: #B4B8C0">by <a href="#">[CREATOR]</a> · weather, rain, staying in</span>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A3F48; background: #171A1F; font-size: 13px; font-weight: 500"><svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1 5c1.5-3 3-3 4.5 0s3 3 4.5 0 3-3 3 0"></path></svg>Tranquil</span>
<span style="display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A3F48; background: #171A1F; font-size: 13px; font-weight: 500"><svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1 5c1.5-3 3-3 4.5 0s3 3 4.5 0 3-3 3 0"></path></svg>Strange</span>
<span style="display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #3A3F48; background: #171A1F; font-size: 13px; font-weight: 500"><svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1 5c1.5-3 3-3 4.5 0s3 3 4.5 0 3-3 3 0"></path></svg>Hopeful</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 520px">
<span style="font-size: 12px; color: #A7ABB3">Vibe arc</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px" role="img" aria-label="Vibe arc: starts tranquil, turns strange in the middle, ends hopeful">
<div style="display: flex; flex-direction: column; gap: 4px"><div style="height: 6px; border-radius: 3px; background: #4A5060"></div><span style="font-size: 13px">Starts tranquil</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><div style="height: 6px; border-radius: 3px; background: repeating-linear-gradient(135deg, #B4B8C0 0 3px, #4A5060 3px 6px)"></div><span style="font-size: 13px">Turns strange</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><div style="height: 6px; border-radius: 3px; background: #E8E9EC"></div><span style="font-size: 13px">Ends hopeful</span></div>
</div>
</div>
<p style="margin: 0; font-family: 'Patrick Hand', 'Comic Neue', cursive; font-size: 22px; line-height: 1.3; max-width: 620px; color: #E8E9EC">I made this on a wet afternoon when everything sounded like rain. It starts calm, gets strange in the middle, and ends somewhere hopeful.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px">
<button type="button" style="min-height: 48px; padding: 0 22px; border-radius: 10px; border: none; background: #E8E9EC; color: #101216; font-weight: 600; font-size: 15px; cursor: pointer">Start collecting</button>
<a href="#running-order" style="display: flex; align-items: center; min-height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid #3A3F48; background: #1A1D22; color: #E8E9EC; font-weight: 500; text-decoration: none">See the running order</a>
<button type="button" aria-label="Save for later" style="min-height: 48px; width: 48px; border-radius: 10px; border: 1px solid #3A3F48; background: #1A1D22; color: #E8E9EC; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 1.5h12v15l-6-4-6 4z"></path></svg></button>
</div>
<span style="font-size: 13px; color: #A7ABB3">[N] people collecting · [N] completed</span>
</div>
</div>

<!-- What you'll need -->
<div style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 22px">What you'll need</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<div style="background: #171A1F; border: 1px solid #262A31; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px">5</span><span style="font-weight: 600">Free online</span><span style="font-size: 12px; color: #A7ABB3">Video sites, podcasts, radio catch-up</span></div>
<div style="background: #171A1F; border: 1px solid #262A31; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px">2</span><span style="font-weight: 600">Subscription or rental</span><span style="font-size: 12px; color: #A7ABB3">Any film service or a DVD</span></div>
<div style="background: #171A1F; border: 1px solid #262A31; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px">2</span><span style="font-weight: 600">Archive digging</span><span style="font-size: 12px; color: #A7ABB3">Both have fallbacks</span></div>
<div style="background: #171A1F; border: 1px solid #262A31; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px">3</span><span style="font-weight: 600">Do it yourself</span><span style="font-size: 12px; color: #A7ABB3">Pauses and things to do in the room</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #B4B8C0">Media mix, by running time</span>
<div style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px" role="img" aria-label="Film 24%, radio 21%, TV 20%, podcast 11%, YouTube 9%, Interference 8%, in-between 6%">
<div style="flex: 115; background: #F06A6E"></div><div style="flex: 102; background: #E9A23B"></div><div style="flex: 95; background: #4C8DF6"></div><div style="flex: 55; background: #A68BF5"></div><div style="flex: 45; background: #3DBE7A"></div><div style="flex: 40; background: linear-gradient(#3DBE7A 0 50%, #E9A23B 50% 100%)"></div><div style="flex: 28; background: #A7ABB3"></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: #B4B8C0">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #F06A6E"></span>Film 24%</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #E9A23B"></span>Radio 21%</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #4C8DF6"></span>TV 20%</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #A68BF5"></span>Podcast 11%</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #3DBE7A"></span>YouTube 9%</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(#3DBE7A 0 50%, #E9A23B 50% 100%)"></span>Interference 8%</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #A7ABB3"></span>In-between 6%</span>
</div>
</div>
</div>

<!-- Running order + sidebar -->
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div id="running-order" style="flex: 999 1 640px; min-width: 0; background: #171A1F; border: 1px solid #262A31; border-radius: 14px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; padding: 16px 18px; border-bottom: 1px solid #262A31">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 20px">Running order</h2>
<span style="font-size: 12px; color: #A7ABB3">The creator's notes stay hidden until you finish</span>
</div>
<sc-for list="{{slots}}" as="s" hint-placeholder-count="12">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid #1F2329">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A7ABB3; width: 18px; flex: none">{{s.num}}</span>
<span style="width: 10px; height: 28px; border-radius: 3px; background: {{s.color}}; flex: none"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</span>
<span style="font-size: 12px; color: #A7ABB3">{{s.sub}}</span>
</div>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{s.rarityColor}}; flex: none">{{s.rarityLabel}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #B4B8C0; width: 40px; text-align: right; flex: none">{{s.len}}</span>
</div>
</sc-for>
</div>

<aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #171A1F; border: 1px solid #262A31; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 18px">Before you start</h2>
<div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #B4B8C0">Availability</span><span style="text-align: right">Best in the UK · 9 of 12 slots worldwide</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #B4B8C0">Content warnings</span><span>Unsettling interlude (slot 9)</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #B4B8C0">Spoilers</span><span>None</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #B4B8C0">Locked slots</span><span>1, revealed as you go</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #B4B8C0">Mystery slots</span><span>2</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #B4B8C0">Interference</span><span>1, clash mode</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #B4B8C0">Typical time to collect</span><span>[TIME]</span></div>
<div style="display: flex; gap: 10px; padding: 12px; border-radius: 10px; background: #1D2026; font-size: 13px">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#E9A23B" stroke-width="1.6" style="flex: none; margin-top: 2px" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 4.5v4M8 11v.5"></path></svg>
<span>Collecting from the UK: <strong>11 of 12</strong> slots look available, and slot 8 may need a fallback. Outside the UK, 3 slots are UK-only and only one has a worldwide fallback.</span>
</div>
</div>

<div style="background: #171A1F; border: 1px solid #262A31; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 18px">"I made this"</h2>
<div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid #262A31">
<span style="font-size: 13px; font-weight: 600">[USER] <span style="font-weight: 400; color: #A7ABB3">· used 1 fallback</span></span>
<span style="color: #D3D5DA">[Their response, with spoilers hidden until you've finished the tape]</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 600">[USER] <span style="font-weight: 400; color: #A7ABB3">· all original sources</span></span>
<span style="color: #D3D5DA">[Their response]</span>
</div>
<a href="#" style="font-size: 13px">Read all responses</a>
</div>
</aside>
</div>

</div>
</div>
</template>
<script>
class Component extends DCLogic {
  renderVals() {
    var colors = { radio: "#E9A23B", tv: "#4C8DF6", film: "#F06A6E", youtube: "#3DBE7A", podcast: "#A68BF5", between: "#A7ABB3", interference: "linear-gradient(#3DBE7A 0 50%, #E9A23B 50% 100%)" };
    var labels = { radio: "Radio", tv: "TV", film: "Film", youtube: "YouTube", podcast: "Podcast", between: "In-between", interference: "Interference" };
    var rar = { common: ["Common", "#A7ABB3"], uncommon: ["Uncommon", "#8DB8FF"], rare: ["Rare", "#F2B65A"], diy: ["You", "#A7ABB3"] };
    var raw = [
      ["between", 8, "Count down from five, out loud", "diy", "count down", ""],
      ["radio", 42, "A late-night weather bulletin, read slowly", "common", "weather bulletin", "Free · radio catch-up"],
      ["youtube", 45, "Rain on a tin roof", "common", "rain on a tin roof", "Free · video site"],
      ["film", 55, "Mystery: someone waiting at a bus stop in the rain", "uncommon", "? bus stop", "Any film · a clue, not a timestamp"],
      ["between", 10, "Lights off, ten seconds of silence", "diy", "lights off", ""],
      ["podcast", 55, "Someone describing the smell of rain", "uncommon", "petrichor", "Free · podcast apps"],
      ["tv", 45, "Mystery: a weather presenter loses their composure", "rare", "? forecaster", "Any year · has fallbacks"],
      ["radio", 60, "1980s phone-in: a caller reports strange lights", "rare", "strange lights", "Archive · has fallbacks"],
      ["interference", 40, "Interference: a sunny pop video over a gale warning", "uncommon", "~ interference ~", "Clash · muted video plus separate sound"],
      ["tv", 50, "Children's TV segment about jumping in puddles", "uncommon", "puddles", "Archive or catch-up"],
      ["between", 10, "Open a window, if it's raining", "diy", "open a window", ""],
      ["film", 60, "Locked: revealed once slot 10 is found", "uncommon", "[locked]", "Subscription or rental"]
    ];
    var slots = raw.map(function (r, i) {
      var r2 = rar[r[3]];
      return {
        num: String(i + 1),
        color: colors[r[0]],
        title: r[2],
        sub: labels[r[0]] + (r[5] ? " · " + r[5] : " · do it yourself"),
        rarityLabel: r2[0],
        rarityColor: r2[1],
        len: "0:" + (r[1] < 10 ? "0" : "") + r[1],
        jcard: r[4]
      };
    });
    slots.forEach(function (s, i) { if (raw[i][1] >= 60) { s.len = "1:00"; } });
    return { slots: slots };
  }
}
mountComponent(Component);
</script>
</body>
</html>
