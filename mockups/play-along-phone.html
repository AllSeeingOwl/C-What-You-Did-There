<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play-along on a phone · Side C mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@500;700&amp;family=Patrick+Hand&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C0F}
a{color:#9CC2FF}a:hover{color:#C6DCFF}
button{font-family:inherit}
</style>
<script src="runtime.js"></script>
</head>
<body>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #0B0C0F"><div id="app" style="border-radius: 28px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5)"></div></div>
<template id="tpl">
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0C0F; color: #E8E9EC; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column">

<!-- Header -->
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 12px; border-bottom: 1px solid #1E2127">
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Exit play-along" style="width: 44px; height: 44px; margin-left: -10px; border: none; background: transparent; color: #E8E9EC; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14"></path></svg></button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Rain on a Tuesday</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A7ABB3">{{progressText}}</span>
</div>
</div>
<div style="display: flex; gap: 2px; height: 22px">
<sc-for list="{{segs}}" as="g" hint-placeholder-count="12">
<button type="button" onClick="{{g.go}}" aria-label="{{g.aria}}" style="flex: {{g.flex}} 1 0; min-width: 5px; padding: 0; border-radius: 3px; cursor: pointer; {{g.look}}"></button>
</sc-for>
</div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{toggleChime}}" aria-pressed="{{chimePressed}}" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 12px; cursor: pointer; {{chimeLook}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5a4 4 0 0 1 4 4v3l1.5 2h-11L4 9.5v-3a4 4 0 0 1 4-4zM6.5 13.5a1.5 1.5 0 0 0 3 0"></path></svg>Chime at the end</button>
<button type="button" onClick="{{toggleAwake}}" aria-pressed="{{awakePressed}}" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 12px; cursor: pointer; {{awakeLook}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="3"></circle><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"></path></svg>Keep screen on</button>
</div>
</div>

<!-- Body -->
<div style="flex: 1; overflow-y: auto; padding: 18px 16px">

<!-- Clip -->
<sc-if value="{{isClip}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{cur.color}}"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{cur.color}}"></span>{{cur.laneLabel}} · {{cur.lenText}}</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em; line-height: 1.1">{{cur.mine}}</h1>
<div style="background: #15171C; border: 1px solid #262A31; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #A7ABB3">Play from</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 26px">{{cur.from}} → {{cur.to}}</span>
</div>
<div style="background: #15171C; border: 1px solid #262A31; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A7ABB3">Your source</span><span>{{cur.source}}</span></div>
<a href="#" style="flex: none; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A3F48; color: #E8E9EC; text-decoration: none; font-size: 13px; font-weight: 600">Open<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.5 2H10v5.5M10 2L3 9"></path></svg></a>
</div>
<span style="font-size: 12px; color: #A7ABB3">Start the timer, switch to the app and play your clip, then come back. The timer keeps going while you're away.</span>
</div>
</sc-if>

<!-- In-between -->
<sc-if value="{{isInstr}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; min-height: 440px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #A7ABB3">In-between · {{cur.lenText}}</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 34px; letter-spacing: -0.02em; line-height: 1.12">{{cur.mine}}</h1>
<span style="font-size: 13px; color: #A7ABB3">Nothing to open. Just do it, then tap Next.</span>
</div>
</sc-if>

<!-- Interference -->
<sc-if value="{{isInterf}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #D9DBE0"><span style="width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(#3DBE7A 0 50%, #E9A23B 50% 100%)"></span>Interference · {{cur.mode}} · {{cur.lenText}}</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em; line-height: 1.1">Two things at once</h1>
<div style="background: #15171C; border: 1px solid #262A31; border-top: 4px solid #3DBE7A; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3DBE7A">1 · Picture, muted</span>
<span>{{cur.pic}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 15px">{{cur.picFrom}} → {{cur.picTo}}</span>
</div>
<a href="#" style="flex: none; display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A3F48; color: #E8E9EC; text-decoration: none; font-size: 13px; font-weight: 600">Open</a>
</div>
<div style="background: #15171C; border: 1px solid #262A31; border-top: 4px solid #E9A23B; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #E9A23B">2 · Sound</span>
<span>{{cur.snd}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 15px">{{cur.sndFrom}} → {{cur.sndTo}}</span>
</div>
<a href="#" style="flex: none; display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A3F48; color: #E8E9EC; text-decoration: none; font-size: 13px; font-weight: 600">Open</a>
</div>
<div style="padding: 12px 14px; border-radius: 12px; border: 1.5px dashed #D9DBE0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #D9DBE0">Sync cue</span>
<span style="font-size: 16px">{{cur.cue}}</span>
</div>
<span style="font-size: 12px; color: #A7ABB3">Two sources at once is easier with a second screen: play the picture on a TV or laptop and the sound on your phone.</span>
</div>
</sc-if>

<!-- Reveal -->
<sc-if value="{{isReveal}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px; text-align: center; align-items: center; padding: 8px 0">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #A7ABB3">Tape complete · 8:00</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em; line-height: 1.05">See what they did there</h1>
</div>
<div style="display: flex; flex-direction: column; background: #15171C; border: 1px solid #262A31; border-radius: 14px; overflow: hidden">
<sc-for list="{{reveal}}" as="r" hint-placeholder-count="12">
<div style="display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #1E2127">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A7ABB3; width: 16px; flex: none; padding-top: 2px">{{r.num}}</span>
<span style="width: 6px; border-radius: 3px; background: {{r.color}}; flex: none"></span>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 11px; color: #A7ABB3">{{r.mine}}</span><span style="font-family: 'Patrick Hand', cursive; font-size: 18px; line-height: 1.25">{{r.note}}</span></div>
</div>
</sc-for>
</div>
<a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: #E8E9EC; color: #0B0C0F; font-weight: 600; font-size: 15px; text-decoration: none">Write an "I made this"</a>
<button type="button" onClick="{{restart}}" style="min-height: 48px; border-radius: 12px; border: 1px solid #3A3F48; background: transparent; color: #E8E9EC; font-size: 14px; cursor: pointer">Play it again</button>
</div>
</sc-if>
</div>

<!-- Controls -->
<sc-if value="{{notReveal}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 20px; border-top: 1px solid #1E2127; background: #0F1014">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 30px">{{timerText}}</span>
<span style="font-size: 12px; color: #A7ABB3">{{upNext}}</span>
</div>
<div style="height: 6px; border-radius: 3px; background: #1E2127; overflow: hidden"><div style="height: 6px; background: {{cur.barColor}}; width: {{elapsedPct}}%"></div></div>
<div style="display: flex; gap: 10px; align-items: center">
<button type="button" onClick="{{back}}" aria-label="Previous slot" style="width: 52px; height: 52px; flex: none; border-radius: 14px; border: 1px solid #3A3F48; background: transparent; color: #E8E9EC; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 3L5 9l6 6"></path></svg></button>
<button type="button" onClick="{{toggleTimer}}" style="flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid #3A3F48; background: #15171C; color: #E8E9EC; font-weight: 600; font-size: 15px; cursor: pointer">{{timerLabel}}</button>
<button type="button" onClick="{{next}}" style="flex: 1; min-height: 52px; border-radius: 14px; border: none; background: #E8E9EC; color: #0B0C0F; font-weight: 600; font-size: 15px; cursor: pointer">{{nextLabel}}</button>
</div>
</div>
</sc-if>

</div>
</template>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.slots = [
      { lane: "between", dur: 8, mine: "Count down from five, out loud.", note: "Sets the tone. Don't rush it." },
      { lane: "radio", dur: 42, mine: "The overnight weather bulletin", from: "0:12", to: "0:54", source: "Radio catch-up app", note: "The calmer the voice, the better." },
      { lane: "youtube", dur: 45, mine: "Rain on a tin roof", from: "0:45", to: "1:30", source: "Video app", note: "Let it fade in under the end of the bulletin if you can." },
      { lane: "film", dur: 55, mine: "Your pick: the bus stop scene", from: "1:12:04", to: "1:12:59", source: "Your film, on DVD", note: "Everyone's tape will be different here. That's the point." },
      { lane: "between", dur: 10, mine: "Turn the lights off. Ten seconds of silence.", note: "Halfway point. Breathe." },
      { lane: "podcast", dur: 55, mine: "Someone describing the smell of rain", from: "14:20", to: "15:15", source: "Podcast app", note: "I wanted something that explains the feeling, not just the sound." },
      { lane: "tv", dur: 45, mine: "Your pick: the forecaster who couldn't stop laughing", from: "0:08", to: "0:53", source: "Video app, clip collection", note: "The tape needs a laugh right here, just before it gets strange." },
      { lane: "radio", dur: 60, mine: "Fallback B: a documentary interview about a sighting", from: "22:31", to: "23:31", source: "Podcast app", note: "The hardest find on the tape. Worth it." },
      { lane: "interference", dur: 40, mine: "Interference: a sunny pop video over a gale warning", mode: "Clash", pic: "The sunny pop video you picked", picFrom: "1:02", picTo: "1:42", snd: "The gale warning recording", sndFrom: "0:00", sndTo: "0:40", cue: "Start the sound the moment the singer first smiles at the camera.", note: "Everything outside is falling apart, and nobody in the video has noticed." },
      { lane: "tv", dur: 50, mine: "The puddle-jumping segment", from: "3:05", to: "3:55", source: "TV catch-up app", note: "Rain stops being sad here." },
      { lane: "between", dur: 10, mine: "Open a window, if it's raining. If not, imagine it.", note: "The only slot that changes depending on the day you play it." },
      { lane: "film", dur: 60, mine: "The final scene: credits over rain", from: "1:41:10", to: "1:42:10", source: "Film streaming app", note: "End on the sound, not the picture." }
    ];
    this.state = { idx: 8, remaining: 40, running: false, chime: true, awake: true };
  }

  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () {
      if (!self.state.running) { return; }
      if (self.state.remaining <= 1) { self.setState({ remaining: 0, running: false }); }
      else { self.setState({ remaining: self.state.remaining - 1 }); }
    }, 1000);
  }

  componentWillUnmount() { clearInterval(this.timer); }

  renderVals() {
    var self = this;
    var colors = { radio: "#E9A23B", tv: "#4C8DF6", film: "#F06A6E", youtube: "#3DBE7A", podcast: "#A68BF5", between: "#A7ABB3", interference: "#D9DBE0" };
    var labels = { radio: "Radio", tv: "TV", film: "Film", youtube: "YouTube", podcast: "Podcast", between: "In-between", interference: "Interference" };
    var SPLIT = "linear-gradient(#3DBE7A 0 50%, #E9A23B 50% 100%)";
    var slots = this.slots;
    var st = this.state;
    var idx = st.idx;
    var total = slots.length;
    function tc(s) { var m = Math.floor(s / 60); var r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }
    function go(i) { self.setState({ idx: i, remaining: i < total ? slots[i].dur : 0, running: false }); }

    var isReveal = idx >= total;
    var c = isReveal ? slots[total - 1] : slots[idx];
    var cur = {
      color: colors[c.lane], barColor: c.lane === "interference" ? SPLIT : colors[c.lane],
      laneLabel: labels[c.lane], lenText: tc(c.dur), mine: c.mine,
      from: c.from || "", to: c.to || "", source: c.source || "",
      mode: c.mode || "", pic: c.pic || "", picFrom: c.picFrom || "", picTo: c.picTo || "",
      snd: c.snd || "", sndFrom: c.sndFrom || "", sndTo: c.sndTo || "", cue: c.cue || ""
    };
    var before = 0;
    for (var k = 0; k < Math.min(idx, total); k++) { before += slots[k].dur; }

    var segs = slots.map(function (s, i) {
      var bg = s.lane === "interference" ? SPLIT : colors[s.lane];
      var look;
      if (i < idx) { look = "background: " + bg + "; opacity: 0.4; border: none;"; }
      else if (i === idx) { look = "background: " + bg + "; border: none; box-shadow: 0 0 0 2px #0B0C0F, 0 0 0 3px #FFFFFF;"; }
      else { look = "background: transparent; border: 1.5px solid " + colors[s.lane] + ";"; }
      return { flex: s.dur, look: look, aria: "Go to slot " + (i + 1) + ", " + labels[s.lane], go: function () { go(i); } };
    });

    var nxt = idx + 1;
    var on = "border: 1px solid #E8E9EC; background: #E8E9EC; color: #0B0C0F; font-weight: 600;";
    var off = "border: 1px solid #3A3F48; background: transparent; color: #B4B8C0;";
    var remaining = st.remaining;

    return {
      cur: cur, segs: segs,
      progressText: isReveal ? "Complete · 8:00" : "Slot " + (idx + 1) + " of " + total + " · " + tc(before) + " in",
      isClip: !isReveal && c.lane !== "between" && c.lane !== "interference",
      isInstr: !isReveal && c.lane === "between",
      isInterf: !isReveal && c.lane === "interference",
      isReveal: isReveal, notReveal: !isReveal,
      reveal: slots.map(function (s, i) { return { num: String(i + 1), color: s.lane === "interference" ? SPLIT : colors[s.lane], mine: s.mine, note: s.note }; }),
      timerText: tc(remaining),
      elapsedPct: isReveal ? 100 : Math.round(((c.dur - remaining) / c.dur) * 100),
      timerLabel: st.running ? "Pause" : (remaining === c.dur ? "Start timer" : (remaining === 0 ? "Restart" : "Resume")),
      upNext: nxt < total ? "Next: slot " + (nxt + 1) + " · " + labels[slots[nxt].lane] : "Next: the reveal",
      nextLabel: idx === total - 1 ? "Reveal" : "Next",
      toggleTimer: function () {
        if (self.state.remaining === 0) { self.setState({ remaining: c.dur, running: true }); }
        else { self.setState({ running: !self.state.running }); }
      },
      next: function () { go(Math.min(idx + 1, total)); },
      back: function () { go(Math.max(idx - 1, 0)); },
      restart: function () { go(0); },
      chimeLook: st.chime ? on : off, chimePressed: st.chime ? "true" : "false",
      awakeLook: st.awake ? on : off, awakePressed: st.awake ? "true" : "false",
      toggleChime: function () { self.setState({ chime: !self.state.chime }); },
      toggleAwake: function () { self.setState({ awake: !self.state.awake }); }
    };
  }
}
mountComponent(Component);
</script>
</body>
</html>
